[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ste-lint"
version = "0.1.0"
description = "Deterministic linter for the structural ASD-STE100 (Simplified Technical English) rules."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Dustin Yuchen Teng" }]
keywords = ["ste100", "simplified-technical-english", "linter", "controlled-language", "pre-commit"]
# Deliberately no runtime dependencies: the linter is stdlib-only.
dependencies = []

[project.urls]
Homepage = "https://github.com/danyuchn/asd-ste100-skill"
Repository = "https://github.com/danyuchn/asd-ste100-skill"

[project.scripts]
ste-lint = "ste_lint:main"

[tool.setuptools]
py-modules = ["ste_lint"]
