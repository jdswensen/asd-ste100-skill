- id: ste-lint
  name: ASD-STE100 structural lint
  description: Lint text for the structural Simplified Technical English rules.
  entry: ste-lint
  language: python
  # Strict by default: fail on any hard violation. Consumers can loosen with
  # `args: [--baseline, 'N']` in their own .pre-commit-config.yaml.
  args: [--baseline, '0']
  # Default to Markdown: the rules target English prose, not source code.
  # Consumers widen or narrow this with their own `types:`/`files:`.
  types: [markdown]

- id: ste-lint-commit-msg
  name: ASD-STE100 commit-message lint
  description: Lint the commit message for the structural STE rules (warns by default).
  entry: ste-lint
  language: python
  args: [--commit-msg]
  stages: [commit-msg]
  # verbose so warn-mode findings are shown: pre-commit hides a passing hook's
  # output, and warn mode exits 0, so without this the warnings are invisible.
  verbose: true
  # Warns by default (prints findings, never blocks). To block commits on a
  # violation, add `args: [--commit-msg, --strict]` in .pre-commit-config.yaml.
  # Install with: pre-commit install --hook-type commit-msg

- id: ste-lint-comments
  name: ASD-STE100 comment lint
  description: Lint only the comments and doc-strings of source files.
  entry: ste-lint
  language: python
  args: [--comments]
  # Pygments is needed only for this hook; the base install stays stdlib-only.
  additional_dependencies: [pygments]
  # Default to the v1 supported source extensions. The linter also skips any
  # unsupported file, so a stray match is harmless. Override with your own
  # `files:`/`types:` to narrow or widen the set.
  files: \.(py|rs|c|cc|cpp|cxx|h|hpp|js|ts|go|sh|bash|zsh|ya?ml|rb|java)$
